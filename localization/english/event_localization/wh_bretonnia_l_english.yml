l_english:
 wh_bretonnia_landed_knight_check.t:0 "The Call of Errantry"
 wh_bretonnia_landed_knight_check.desc:0 "Every noble of Bretonnia must prove their worth before the Lady. The custom is old and unbending: the young take up lance and horse and ride out as Knights Errant, seeking glory in battle until they have earned a place among the Knights of the Realm.\n\nThe road awaits you. You may ride out and win your spurs, or take your seat at court now and bear the whispers of those who will call you unproven."
 wh_bretonnia_landed_knight_check.001.a:0 "For the Lady! I ride as a Knight Errant."
 wh_bretonnia_landed_knight_check.001.b:0 "My place is here. Let them whisper."
