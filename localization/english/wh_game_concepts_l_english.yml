 game_concept_knightly_virtues: "Knightly Virtues"
 game_concept_knightly_virtues_desc: "Knightly Virtues are a set of valorous combat styles, upon which knights of Bretonnia try to emulate, originating from [companions_of_gilles|E], each one of them having perfected their own Virtue with the help of Gilles. Almost none of the modern knights can reach the level of power of [Concept('companions_of_gilles', 'Mighty Thirteen')], but their styles are still superior to anything devised afterwards, even in incomplete version. \n\n#bold Knightly Virtues#! mechanically work as special traits, which the player can choose depending on their character's personality to boost their [prowess|E] and Grail Quest progress (WIP)."
 
 game_concept_companions_of_gilles: "Companions of Gilles"
 game_concept_companions_of_gilles_desc: "Companions of Gilles, also known as Mighty Thirteen, were the loyal champions of Gilles le Breton and dukes of Bretonni people, and were the first of the [thegrail|E] Knights. As they were about to enter a decisive battle with Orc [waaagh|E], they had a fair maiden risen from nearby lake and giving them strength and light, visible in their armours and weapons, but most importantly - eyes. And so the Grail Companions were founded, counting Agilgar of Parravon, Carleond of Couronne, Marcus of Bordeleaux, Thierulf of Lyonesse, Martrud of Montfort, Gilles of Bastonne (more known as Gilles le Breton, the first royarch), Landuin of Mousillon, Balduin of Brionne, Folgar of Artois, Beren of Gisoreux, Fredemund of Aquitaine, Corduin of L'Anguille, Rademund of Quenelles and Lambard of Carcassonne. Respectively, each of them also fought with their own styles, later becoming known as [knightly_virtues|E] of: Audacity, Confidence, Discipline, Duty, Empathy, Heroism, the Ideal, the Impetuous Knight, the Joust, Knightly Temper, Noble Disdain, the Penitent, Purity and Stoicism."

