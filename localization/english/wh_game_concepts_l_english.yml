 game_concept_conceptrace_desc: "Race refers to one of the many species in the world, such as [men|E], [dwarves|E], [hobbits|E], [elves|E], and [orcs|E].\n\nIn-game, cultural [heritage|E] is used to model race, granting unique benefits and options based on the race in question.\n\nIt is not possible to hybridise cultures across races."